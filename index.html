<!DOCTYPE html>
<html lang="en">
<head>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
  </head>
  
</head>
<body>
  <main>
    <div class="image-wrapper">
      <img src="images/image-product-mobile.jpg" alt="photo of the product" class="mobile-image">
      <img src="images/image-product-desktop.jpg" alt="photo of the product" class="desktop-image">
    </div>

    <div class="content">
    <header>
      <p>Perfume</p>
      <h1>Gabrielle Essence Eau De Parfum</h1>
    </header>

    <article>
      <p>
        A floral, solar and voluptuous interpretation composed by Olivier
        Polge, Perfumer-Creator for the House of CHANEL.
      </p>
    </article>

    <section>
      <h1>$149.99</h1>
      <p><del>$169.99</del></p>
    </section>
    <div role="button"><img src="images/icon-cart.svg" alt="">Add to Cart</div>
    </div>


  </main>
</body>
</html>
